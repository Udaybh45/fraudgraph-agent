services:
  # ---------------------------------------------------------
  # 1. FastAPI backend (Python web service)
  # ---------------------------------------------------------
  - type: web
    name: fraudgraph-backend
    env: python
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: TG_HOST
        sync: false
      - key: TG_USERNAME
        sync: false
      - key: TG_PASSWORD
        sync: false
      - key: TG_GRAPH
        value: FraudGraph
      - key: PYTHONUNBUFFERED
        value: "1"

  # ---------------------------------------------------------
  # 2. Vite frontend (Static Site)
  # ---------------------------------------------------------
  - type: web
    name: fraudgraph-frontend
    env: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fraudgraph-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
